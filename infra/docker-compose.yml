
services:
  postgres:
    image: postgres:17
    container_name: korea-lms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: korea_user
      POSTGRES_PASSWORD: korea_dev_password
      POSTGRES_DB: korea_lms
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U korea_user -d korea_lms"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
